name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: tool/check.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - run: npm ci
      - run: npx expo prebuild -p android --no-install
        working-directory: sample
      - run: ./gradlew :app:assembleDebug :app:assembleRelease
        working-directory: sample/android
      # the debug APK has the implementation, the release one only the stub
      - run: "! tool/check-release-apk.sh sample/android/app/build/outputs/apk/debug/app-debug.apk"
      - run: tool/check-release-apk.sh sample/android/app/build/outputs/apk/release/app-release.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild -p ios
        working-directory: sample
      - name: Build Debug and Release for the simulator
        working-directory: sample/ios
        run: |
          for configuration in Debug Release; do
            xcodebuild -workspace FloconSample.xcworkspace -scheme FloconSample -configuration $configuration \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          done
